server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mes-backend
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:mes_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mes.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: mes-secret-key-for-jwt-token-signing-2024-manufacturing-system-long-enough
  expiration: 86400000

logging:
  level:
    com.mes: info
